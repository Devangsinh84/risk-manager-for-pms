version: '3.8'

services:
  frontend:
    image: node:latest
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm install axios && npm run dev -- --host"

  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"  # This is critical so the React app can find the API
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000